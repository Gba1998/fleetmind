services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetmind-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/prisma/fleetmind.db
      - JWT_SECRET=fleetmind-super-secret-key-2026-production
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    networks:
      - fleetmind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetmind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - fleetmind-network

networks:
  fleetmind-network:
    driver: bridge
